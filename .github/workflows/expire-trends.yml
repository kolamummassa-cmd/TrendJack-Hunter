name: Expire Trends

# Runs once a day for free via GitHub Actions, instead of paying for a
# Render Cron Job. Just hits the secret-protected URL on the existing
# (already running) site — see trends/views.py's trigger_expire_trends.

on:
  schedule:
    - cron: "0 6 * * *"   # 6am UTC daily = 9am Kenya time
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab, for testing

jobs:
  expire-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the expire-trends endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://trendjack-hunter.onrender.com/trends/internal/expire-trends/?key=${{ secrets.EXPIRE_TRENDS_SECRET_KEY }}")
          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/response.json
          if [ "$response" -ne 200 ]; then
            echo "Request failed with status $response"
            exit 1
          fi
